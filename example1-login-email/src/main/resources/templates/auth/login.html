<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Đăng nhập</h2>

        <div class="alert error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
        <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất.</div>

        <!-- th:action adds the CSRF hidden field automatically -->
        <form th:action="@{/login}" method="post">
            <label>Email</label>
            <input type="email" name="email" required autofocus>
            <label>Mật khẩu</label>
            <input type="password" name="password" required>
            <button class="button full" type="submit">Đăng nhập</button>
        </form>
        <p class="muted">Demo: admin@iotstar.vn / 123456 &nbsp;|&nbsp; user@iotstar.vn / 123456</p>
    </div>
</div>
</body>
</html>
