<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- Page skeleton: header + content passed by the caller + footer -->
<div th:fragment="page(content)">
    <header th:replace="~{fragments/header :: header}"></header>
    <main class="container" th:replace="${content}"></main>
    <footer class="footer">© IOTSTAR SHOP</footer>
</div>
</body>
</html>
