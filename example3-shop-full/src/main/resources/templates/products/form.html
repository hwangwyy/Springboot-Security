<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <div class="form-card">
            <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>

            <form th:object="${productDTO}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"
                  th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imageUrl}">

                <label for="name">Tên sản phẩm</label>
                <input id="name" type="text" th:field="*{name}">
                <small class="error-text" th:errors="*{name}"></small>

                <label for="description">Mô tả</label>
                <textarea id="description" th:field="*{description}" rows="5"></textarea>

                <label for="price">Giá</label>
                <input id="price" type="number" step="0.01" th:field="*{price}">
                <small class="error-text" th:errors="*{price}"></small>

                <label for="image">Ảnh (upload lên Cloudinary)</label>
                <input id="image" type="file" name="image" accept="image/*">

                <div th:if="${productDTO.imageUrl != null and !productDTO.imageUrl.isEmpty()}">
                    <img th:src="${productDTO.imageUrl}" class="preview" alt="current image">
                </div>

                <button class="button" type="submit">Lưu</button>
                <a class="button secondary" th:href="@{/products}">Hủy</a>
            </form>
        </div>
    </main>
</div>
</body>
</html>
