<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">IOTSTAR SHOP</a>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/products}" th:if="${#authorization.expression('isAuthenticated()')}">Products</a>
        <a th:href="@{/users}" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Users</a>
    </nav>
    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <span th:text="${#authentication.principal.fullName}"></span>
        <span class="muted" th:text="'(' + ${#authentication.name} + ')'"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="link-button">Logout</button>
        </form>
    </div>
    <div th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}">Login</a>
    </div>
</header>
</body>
</html>
